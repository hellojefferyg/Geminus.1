    <style>
        :root {
            --bg-primary: #000000;
            --accent-cyan: #00ffff;
            --panel-bg: rgba(10, 30, 35, 0.75);
            --panel-border: rgba(0, 255, 255, 0.2);
            --text-primary: #e0f8ff;
            --text-secondary: #a8cde0;
            --status-positive: #ffd700;
            --status-negative: #ff4d4d;
            --ai-purple: #d8b4fe;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            overflow: hidden;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }

        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
        }

        #game-data-editor-modal { z-index: 100; }
        .main-container { transition: transform 0.3s ease-in-out; }

        .glass-panel {
            background: var(--panel-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
        }
        
        .header-panel {
            border-radius: 0;
            border-bottom: 1px solid var(--panel-border);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.05);
        }
        .header-panel h2 { text-shadow: 0 0 5px var(--accent-cyan), 0 0 10px var(--accent-cyan); }
        
        .action-button {
            border: 1px solid var(--panel-border); padding: 4px 12px; border-radius: 6px;
            font-size: 0.8rem; transition: all 0.2s ease; color: var(--text-secondary);
        }
        .action-button:hover {
            color: var(--accent-cyan); border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .action-button.save { color: var(--status-positive); border-color: rgba(255, 215, 0, 0.5); }
        .action-button.save:hover { border-color: var(--status-positive); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .action-button.reset { color: var(--status-negative); border-color: rgba(255, 77, 77, 0.5); }
        .action-button.reset:hover { border-color: var(--status-negative); box-shadow: 0 0 10px rgba(255, 77, 77, 0.5); }
        .action-button.ai-btn { color: #d8b4fe; border-color: rgba(216, 180, 254, 0.5); }
        .action-button.ai-btn:hover { border-color: #d8b4fe; box-shadow: 0 0 10px rgba(216, 180, 254, 0.5); }


        .nav-panel { border-radius: 0; }
        .nav-group {
            padding: 0.5rem 1rem; font-family: 'Cinzel', serif; font-size: 1.1rem;
            color: var(--text-secondary); cursor: pointer; list-style: none;
        }
        .nav-group::-webkit-details-marker { display: none; }
        .nav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 1rem 0.6rem 1.5rem; color: var(--text-secondary);
            cursor: pointer; border-radius: 6px; margin: 0.1rem 0.5rem;
            transition: all 0.2s ease; border: 1px solid transparent;
        }
        .nav-item:hover { background-color: rgba(0, 255, 255, 0.05); color: var(--text-primary); }
        .nav-item.active {
            background-color: rgba(0, 255, 255, 0.1); color: var(--accent-cyan);
            font-weight: 600; border: 1px solid var(--panel-border);
            text-shadow: 0 0 3px var(--accent-cyan);
        }

        @media (max-width: 767px) {
            #gdd-editor-nav {
                position: fixed; top: 0; left: 0; height: 100%; width: 75%; z-index: 110;
            }
            .main-container.nav-open {
                transform: translateX(75%);
            }
        }
        @media (min-width: 768px) {
            #gdd-editor-nav {
                position: relative; width: 0; transition: width 0.3s ease-in-out; z-index: 110;
            }
            #gdd-editor-nav.is-open { width: 25%; }
            #gdd-editor-main-content.nav-open { width: 75%; }
        }
        
        .main-panel { border-radius: 0; }
        .list-item { border-bottom: 1px solid var(--panel-border); transition: all 0.2s ease; padding: 0.75rem 1rem; }
        .list-item:hover { background-color: rgba(0, 255, 255, 0.05); }
        .list-item.active { background-color: rgba(0, 255, 255, 0.1); border-left: 3px solid var(--accent-cyan); }
        .editor-input, .editor-textarea, .editor-select {
            background-color: rgba(0,0,0,0.3); border: 1px solid var(--panel-border);
            color: var(--text-primary); padding: 6px 10px; border-radius: 4px; width: 100%; font-size: 14px;
        }
        .editor-input:focus, .editor-textarea:focus, .editor-select:focus {
            outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--panel-border); border-radius: 3px; }

        .editor-field-group { margin-top: 1rem; border: 1px solid var(--panel-border); padding: 0.75rem; border-radius: 6px; }
        .editor-field-group h5 { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--panel-border); padding-bottom: 0.25rem;}
        
        .details-item summary {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-weight: 600;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .details-item summary::-webkit-details-marker { display: none; }
        .details-item[open] > summary {
            border-bottom: 1px solid var(--panel-border);
            background-color: rgba(0, 255, 255, 0.05);
        }
        .details-item .details-content { padding: 0.75rem; }
        .dynamic-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .tab-button, .sort-button {
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .tab-button.active, .sort-button.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            font-weight: 600;
        }
        .sort-button { border: 1px solid var(--panel-border); border-radius: 6px; font-size: 0.75rem; padding: 2px 8px; }
        .sort-button.active { background-color: rgba(0, 255, 255, 0.1); }
        .data-table th, .data-table td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--panel-border); }
        .data-table th { font-weight: 600; color: var(--accent-cyan); }
        .data-table tbody tr:hover { background-color: rgba(0, 255, 255, 0.05); }

        /* --- SCOPED CSS FOR ZONE MAKER --- */

            background-color: var(--grounding-black);

        }
        #zone-maker-container .font-cinzel { font-family: 'Cinzel', serif; }
        #zone-maker-container .font-medieval { font-family: 'Medieval Sharp', cursive; }
        #zone-maker-container .font-uncial { font-family: 'Uncial Antiqua', cursive; }
        #zone-maker-container .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #zone-maker-container .glass-panel { background: rgba(29, 29, 29, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--shadow-dark-grey); box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5); }
        #zone-maker-container .glass-button { background: rgba(32, 140, 140, 0.25); border: 1px solid rgba(32, 140, 140, 0.6); color: var(--highlight-powder-blue); transition: all 0.2s ease-in-out; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #zone-maker-container .glass-button:disabled { background: rgba(60, 71, 72, 0.4) !important; border-color: rgba(60, 71, 72, 0.8) !important; cursor: not-allowed; color: #6b7280 !important; }
        #zone-maker-container .glass-button:not(:disabled):hover { background: rgba(32, 140, 140, 0.6); border-color: rgba(62, 200, 200, 0.9); transform: translateY(-2px); }
        #zone-maker-container .glass-button.active { background: var(--glow-vibrant-teal); border-color: #88ffff; color: #ffffff; transform: translateY(-2px); }
        #zone-maker-container .glass-button:not(:disabled):active { transform: translateY(1px) scale(0.98); }
        #zone-maker-container .editor-input, #zone-maker-container .editor-select, #zone-maker-container .editor-textarea { background-color: rgba(0,0,0,0.3); border: 1px solid var(--shadow-dark-grey); color: var(--highlight-powder-blue); padding: 4px 8px; border-radius: 4px; width: 100%; font-size: 12px; }
        #zone-maker-container .editor-input:focus, #zone-maker-container .editor-select:focus, #zone-maker-container .editor-textarea:focus { outline: none; border-color: var(--glow-vibrant-teal); box-shadow: 0 0 5px var(--glow-vibrant-teal); }
        #zone-maker-container input:-webkit-autofill, #zone-maker-container input:-webkit-autofill:hover, #zone-maker-container input:-webkit-autofill:focus, #zone-maker-container input:-webkit-autofill:active { -webkit-box-shadow: 0 0 0 30px var(--grounding-black) inset !important; -webkit-text-fill-color: var(--highlight-powder-blue) !important; caret-color: var(--highlight-powder-blue) !important; }
        #zone-maker-container .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        #zone-maker-container .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        #zone-maker-container .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--shadow-dark-grey); border-radius: 4px; }
        #zone-maker-container .accordion-item-bg { background: rgba(10, 30, 35, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.2); color: #e0f8ff; transition: all 0.3s ease; }
        #zone-maker-container .accordion-item-bg button { color: #e0f8ff; text-shadow: 0 0 4px rgba(0, 255, 255, 0.7); }
        #zone-maker-container .accordion-item-bg-active { background: #00ffff; color: #000; box-shadow: 0 0 10px #00ffff, inset 0 0 6px rgba(0, 255, 255, 0.8); border-color: #00ffff; }
        #zone-maker-container .accordion-item-bg-active button, #zone-maker-container .accordion-item-bg-active span, #zone-maker-container .accordion-item-bg-active input { color: #000; text-shadow: none; }
        #zone-maker-container .accordion-item-bg-active .editor-input { background-color: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.3); }

        /* --- SCOPED CSS FOR QUEST MAKER --- */
        #quest-maker-container { height: 100%; width: 100%; }
        #quest-maker-container .font-cinzel { font-family: 'Cinzel', serif; }
        #quest-maker-container .glass-panel { background: var(--panel-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--panel-border); border-radius: 8px; }

        #quest-maker-container .action-button:hover:not(:disabled) { color: var(--accent-cyan); border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }
        #quest-maker-container .action-button:disabled { opacity: 0.5; cursor: not-allowed; }

        #quest-maker-container .action-button.reset:hover:not(:disabled) { border-color: var(--status-negative); box-shadow: 0 0 10px rgba(255, 77, 77, 0.5); }
        #quest-maker-container .action-button.ai-btn { color: var(--ai-purple); border-color: rgba(216, 180, 254, 0.5); }
        #quest-maker-container .action-button.ai-btn:hover:not(:disabled) { border-color: var(--ai-purple); box-shadow: 0 0 10px rgba(216, 180, 254, 0.5); }
        #quest-maker-container .editor-input, #quest-maker-container .editor-textarea, #quest-maker-container .editor-select { background-color: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); color: var(--text-primary); padding: 8px 12px; border-radius: 4px; width: 100%; font-size: 14px; }
        #quest-maker-container .editor-input:focus, #quest-maker-container .editor-textarea:focus, #quest-maker-container .editor-select:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
        #quest-maker-container .custom-scrollbar::-webkit-scrollbar { width: 6px; }

        #quest-maker-container .tab-button.active { color: var(--accent-cyan); border-color: var(--panel-border); border-bottom-color: transparent; background-color: var(--panel-bg); border-top-left-radius: 6px; border-top-right-radius: 6px; }

        /* --- SCOPED CSS FOR CLAN MAKER --- */
        #clan-maker-container { --bg-dark: #0c101d; --highlight-powder-blue: #cae9ea; --shadow-dark-grey: #3c4748; --accent-cyan: #22d3ee; width: 100%; height: 100%; color: var(--highlight-powder-blue); background-color: var(--bg-dark); }
        #clan-maker-container .glass-panel { background: rgba(29, 29, 29, 0.45); backdrop-filter: blur(12px); border: 1px solid var(--shadow-dark-grey); box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5); }

        #clan-maker-container #clan-maker-map-canvas:active, #clan-maker-container #clan-maker-bastion-canvas:active { cursor: grabbing; }

        #clan-maker-container #clan-maker-loading-progress-inner { width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--highlight-powder-blue), transparent); background-size: 200% 100%; animation: clan-maker-loading-scan 2s linear infinite; }

        #clan-maker-container .tab-button.active { background-color: rgba(34, 211, 238, 0.2); border-bottom-color: var(--accent-cyan); }

        /* --- SCOPED CSS FOR ESTATE MAKER --- */

const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
class Particle { constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 1.5 + 0.5; this.speedX = (Math.random() * 0.5 - 0.25); this.speedY = (Math.random() * 0.5 - 0.25); this.color = `rgba(0, 255, 255, ${Math.random() * 0.5 + 0.2})`; } update() { this.x += this.speedX; this.y += this.speedY; if (this.x > canvas.width || this.x < 0) this.speedX *= -1; if (this.y > canvas.height || this.y < 0) this.speedY *= -1; } draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function initParticles() { particles = []; let n = (canvas.width * canvas.height) / 9000; for (let i = 0; i < n; i++) particles.push(new Particle()); }
function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }

// --- 1. DATA MANAGER MODULE ---

    saveItem(key, itemKey, newItemData, subKey) { 
        if (subKey && this.GDD[key]?.[subKey]) this.GDD[key][subKey][itemKey] = newItemData;

    tabbedViews: ['gems', 'accessories'],

        zoneType: ["Starter", "Standard", "Gold", "Gem", "Shadow", "Pure Grade"], archetype: ["True Fighter", "True Caster", "Hybrid"], subArchetype: ["N/A", "Martial", "Mystic"], primaryStat: ["DEX", "WIS", "VIT"], sourceStat: ["DEX", "WIS", "VIT"], effectTarget: ["Double Hit Chance %", "Weapon Class", "Critical Hit Damage %", "Hit Chance %", "Spell Class", "Spell Critical Hit Chance %", "Spellstrike Damage %"], gemCategory: ["Fighter/Hybrid", "Caster", "Misc/Support"], enchantmentCategory: ["Fighter", "Caster", "Support"], accessoryCategory: ["Utility", "Archetype"], forArchetype: ["N/A", "True Fighter", "True Caster", "Martial Hybrid", "Mystic Hybrid", "Troll (VIT FTR)", "Vampire (VIT CST)"], rarity: ["Uncommon", "Rare", "Epic", "Legendary"], valueType: ["Static", "%"]
    },

    init() {
        document.getElementById('launch-dev-tools-btn').addEventListener('click', () => this.open());
        document.getElementById('gdd-editor-close-btn').addEventListener('click', () => this.close());
        document.getElementById('nav-toggle-btn').addEventListener('click', () => this.toggleNavPanel());
        document.getElementById('nav-backdrop').addEventListener('click', () => this.toggleNavPanel());
        document.getElementById('gdd-editor-refresh-btn').addEventListener('click', () => this.handleReset());
        document.getElementById('gdd-editor-commit-btn').addEventListener('click', () => this.handleSaveAll());
        document.getElementById('gdd-editor-validate-btn').addEventListener('click', () => ValidationManager.run());

        const contentWrapper = document.getElementById('gdd-editor-content-wrapper');
        contentWrapper.addEventListener('click', (e) => {
            const button = e.target.closest('[data-action]');
            if (!button) return;
            const { action, key, id, subkey, sortby } = button.dataset;
            
            if (action === 'delete-item') this.handleDeleteItem(key, id, subkey);
            if (action.startsWith('export-')) this.handleExport(action.split('-')[1]);
            if (action === 'add-monster') this.handleAddMonster(button);
            if (action === 'delete-monster') this.handleDeleteMonster(button);
            if (action === 'add-aptitude') this.addDynamicListItem(button, this.createAptitudeItem);
            if (action === 'add-effect') this.addDynamicListItem(button, this.createEffectEditor);
            if (action === 'remove-item') button.closest('.dynamic-item').remove();
            if (action === 'sort-list') this.sortList(key, sortby, subkey);
            if (action === 'back-to-list') this.showListView();
            if (action === 'import-text-data') this.handleTextImport();
            if (action === 'save-item') this._saveItemData(button.dataset.key, button.dataset.id, button.dataset.subkey || null);
        });
    },

    open() {
        this.buildNav();
        document.getElementById('game-data-editor-modal').classList.remove('hidden');
        document.getElementById('game-data-editor-modal').classList.add('flex');
        if (window.innerWidth >= 768 && !this.isNavOpen) this.toggleNavPanel();
        if(this.activePath.length === 0) {
            const firstNavItem = document.querySelector('.nav-item');
            if(firstNavItem) this.navigateToPath(JSON.parse(firstNavItem.dataset.path));
        }
    },

    close() { 
        document.getElementById('game-data-editor-modal').classList.add('hidden'); 
        if (this.isNavOpen) this.toggleNavPanel();
    },

    toggleNavPanel() {
        this.isNavOpen = !this.isNavOpen;
        const nav = document.getElementById('gdd-editor-nav');
        const mainContainer = document.querySelector('.main-container');
        const backdrop = document.getElementById('nav-backdrop');

        if (window.innerWidth < 768) {
            nav.classList.toggle('hidden');
            mainContainer.classList.toggle('nav-open');
            backdrop.classList.toggle('hidden');
        } else {
            nav.classList.toggle('hidden');
            nav.classList.toggle('md:flex');
            nav.classList.toggle('is-open');
            document.getElementById('gdd-editor-main-content').classList.toggle('nav-open');
        }
    },
    
    buildNav() {
        const nav = document.getElementById('gdd-editor-nav');
        nav.innerHTML = '';
        const groups = { 
            "CORE": ["constants", "gameConfig", "proceduralItems", "itemBaseTypes"], 
            "WORLD": ["zones", "races", "specialMonsters"], 
            "ITEMS": ["equipment", "jewelry", "gems", "enchantments", "accessories"], 
            "SYSTEMS": ["quests", "clans", "estates", "soulforge", "mapMaker", "gemcutter"],
            "TOOLS": ["ANALYTICS", "SIMULATOR", "DATA_IO"] 
        };
        for (const groupName in groups) {
            const details = document.createElement('details');
            details.open = true;
            const summary = document.createElement('summary');
            summary.className = 'nav-group';
            summary.textContent = groupName;
            details.appendChild(summary);
            groups[groupName].forEach(itemName => {
                const itemEl = document.createElement('div');
                itemEl.className = 'nav-item';
                itemEl.textContent = itemName.replace(/([A-Z])/g, ' $1').replace('DATA IO', 'Data I/O').trim();
                itemEl.dataset.path = JSON.stringify([itemName]);
                itemEl.innerHTML += `<ion-icon name="chevron-forward-outline"></ion-icon>`;
                details.appendChild(itemEl);
            });
            nav.appendChild(details);
        }
        nav.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => this.navigateToPath(JSON.parse(btn.dataset.path))));
    },

    navigateToPath(path) {
        this.activePath = path;
        this.mobileDetailViewActive = false;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const navItem = document.querySelector(`.nav-item[data-path='${JSON.stringify(path)}']`);
        if (navItem) navItem.classList.add('active');

        const key = path[0];
        const wrapper = document.getElementById('gdd-editor-content-wrapper');
        const editorMap = { 
            'constants': this.renderKeyValueEditor, 'gameConfig': this.renderKeyValueEditor, 
            'proceduralItems': this.renderProceduralItemsEditor, 'itemBaseTypes': this.renderListDetailView,
            'equipment': this.renderEquipmentEditor, 'jewelry': this.renderJewelryEditor, 
            'zones': this.renderListDetailView, 'races': this.renderListDetailView, 
            'enchantments': this.renderListDetailView, 'specialMonsters': this.renderListDetailView, 
            'quests': this.renderQuestMakerEditor, 'gems': this.renderListDetailView, 
            'accessories': this.renderListDetailView, 
            'clans': this.renderClanEditor, 'estates': this.renderEstateEditor, 
            'soulforge': this.renderSoulforgeEditor, 'mapMaker': this.renderMapMakerEditor,
            'gemcutter': this.renderGemCutterEditor,
            'ANALYTICS': this.renderAnalyticsDashboard, 'SIMULATOR': this.renderSimulatorView, 
            'DATA_IO': this.renderDataIOView, 
        };
        const renderFunction = editorMap[key];
        if (renderFunction) {
            if (this.tabbedViews.includes(key)) {
                wrapper.innerHTML = this.renderTabbedListDetailView(key, DataManager.getData(key));
            } else {
                 wrapper.innerHTML = renderFunction.call(this, key, DataManager.getData(key));
            }
           
            if (key === 'ANALYTICS') AnalyticsManager.init();
            if (key === 'SIMULATOR') SimulatorManager.init();
            if (key === 'mapMaker' && !this.isZoneMakerMounted) {
                ZoneMakerModule.mount(DataManager);
                this.isZoneMakerMounted = true;
            }
            if (key === 'quests' && !this.isQuestMakerMounted) {
                QuestMakerModule.init(DataManager);
                this.isQuestMakerMounted = true;
            }
            if (key === 'clans' && !this.isClanMakerMounted) {
                ClanModule.init(DataManager);
                this.isClanMakerMounted = true;
            }
             if (key === 'estates' && !this.isEstateMakerMounted) {
                EstateModule.init(DataManager);
                this.isEstateMakerMounted = true;
            }
            if (key === 'gemcutter' && !this.isGemCutterMounted) {
                GemCutterModule.init(DataManager);
                this.isGemCutterMounted = true;
            }
            if (key === 'soulforge' && !this.isSoulforgeMounted) {
                SoulforgeModule.init(DataManager);
                this.isSoulforgeMounted = true;
            }
        } else {
            wrapper.innerHTML = `<p class="p-4">Editor for '${key}' not yet implemented.</p>`;
        }
        
        const defaultSubkey = this.getDefaultSubkey(key);
        this.attachListDetailListeners(key, defaultSubkey);
        
        if (window.innerWidth < 768 && this.isNavOpen) this.toggleNavPanel();
    },

    getDefaultSubkey(key) {
        if (!this.tabbedViews.includes(key)) return null;
        const data = DataManager.getData(key);
        return (data && typeof data === 'object' && !Array.isArray(data)) ? Object.keys(data)[0] : null;
    },
    
    attachListDetailListeners(key, subKey = null) {
        const wrapper = document.getElementById('gdd-editor-content-wrapper');
        const listPanel = wrapper.querySelector('#list-panel');
        if (listPanel) {
            listPanel.addEventListener('click', e => {
                const listItem = e.target.closest('.list-item');
                if (listItem) this.showDetailView(key, listItem.dataset.key, subKey);
            });
        }
        const addNewBtn = wrapper.querySelector('#add-new-btn');
        if (addNewBtn) addNewBtn.addEventListener('click', () => this.handleAddNewItem(key, subKey));

        const tabs = wrapper.querySelectorAll('.tab-button');
        if(tabs.length > 0) {
            tabs.forEach(tab => tab.addEventListener('click', (e) => {
                const newSubkey = e.target.dataset.subkey;
                this.renderTabContent(key, newSubkey);
                this.attachListDetailListeners(key, newSubkey);
            }));
        }
    },

    renderEquipmentEditor(key, data) {
        const { dropperTiers, slotData } = data;

        }).join('');
        let slotEditor = `<div class="editor-field-group"><h5>Slot Data</h5><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${Object.keys(slotData).map(slot => this.createField(slot, slotData[slot], `equipment-slotData-${slot}`)).join('')}</div></div>`;

    },

    createField(prop, value, id, isReadOnly = false, forceType = null, placeholder = '', optionsHtml = '') {
        let fieldHtml = '';
        const label = `<label for="${id}" class="block text-sm font-medium text-gray-400 mb-1">${prop.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ').trim()}</label>`;
        const disabledAttr = isReadOnly ? 'readonly' : '';
        const options = this.fieldOptions[prop];

        if (forceType === 'select' || (options || optionsHtml)) {
            const finalOptions = options ? options.map(opt => `<option value="${opt}" ${opt == value ? 'selected' : ''}>${opt}</option>`).join('') : optionsHtml;
            fieldHtml = `<select id="${id}" class="editor-select" ${disabledAttr}>${finalOptions}</select>`;
        } else if (typeof value === 'boolean' && !forceType) {
            fieldHtml = `<div class="flex items-center h-full"><input type="checkbox" id="${id}" ${value ? 'checked' : ''} ${disabledAttr} class="form-checkbox h-5 w-5 text-cyan-400 bg-gray-800 border-gray-600 rounded focus:ring-cyan-500"> <label for="${id}" class="ml-2 text-sm text-gray-300">${prop}</label> </div>`;
            return fieldHtml;
        } else if (forceType === 'textarea' || (Array.isArray(value) || (typeof value === 'object' && value !== null))) {
            const textValue = (typeof value === 'object' && value !== null) ? JSON.stringify(value, null, 2) : value;
            fieldHtml = `<textarea id="${id}" class="editor-textarea h-24" ${disabledAttr} placeholder="${placeholder}">${textValue}</textarea>`;
        } else {
            const type = forceType || (typeof value === 'number' ? 'number' : 'text');
            fieldHtml = `<input type="${type}" id="${id}" class="editor-input" value="${value}" ${disabledAttr} placeholder="${placeholder}">`;
        }
        return `<div>${label}${fieldHtml}</div>`;
    },
    
    getInputValue(input) { 
        if (!input) return null; 
        if (input.type === 'checkbox') return input.checked; 
        if (input.type === 'number') return parseFloat(input.value) || 0; 
        if (input.tagName.toLowerCase() === 'textarea') { 
            try { 
                const parsed = JSON.parse(input.value);
                 if (typeof parsed === 'string' && /^\d+(,\s*\d+)*$/.test(parsed)) {
                    return parsed.split(',').map(s => parseFloat(s.trim()));
                }
                return parsed;
            } catch (e) { 
                if (/^\d+(,\s*\d+)*$/.test(input.value)) {
                    return input.value.split(',').map(s => parseFloat(s.trim()));
                }
                return input.value; 
            } 
        } 
        return input.value; 
    },

    generateSortedList(key, dataObject, subKey = null) {
        const dataSet = subKey ? dataObject[subKey] : dataObject;
        if (!dataSet) return '';
        let itemsArray = Object.entries(dataSet);
        const { sortBy } = this.currentSort;
        if (sortBy && this.currentSort.key === key && this.currentSort.subKey == subKey) {
            itemsArray.sort(([, a], [, b]) => {
                let valA = a[sortBy];
                let valB = b[sortBy];
                if (key === 'zones' && sortBy === 'zoneId') {
                    valA = parseInt(a.zoneId.substring(1));
                    valB = parseInt(b.zoneId.substring(1));
                }
                if (valA === undefined || valB === undefined) return 0;
                if (typeof valA === 'string' && typeof valB === 'string') return valA.localeCompare(valB);
                if (valA < valB) return -1;
                if (valA > valB) return 1;
                return 0;
            });
        }
        return itemsArray.map(([itemKey, item]) => {
            let displayName = item.raceName || item.zoneName || item.gemName || item.enchantmentName || item.title || item.itemName || item.questName || itemKey;
            if (key === 'zones') displayName = `${item.zoneId}: ${item.zoneName}`;
            return `<div class="list-item cursor-pointer" data-key="${itemKey}"><span>${displayName}</span></div>`;
        }).join('');

                }
            }
            return newObject;
        };

    // --- REFACTORED TEXT IMPORT SYSTEM (Strategy Pattern) ---
    
    handleTextImport() {
        const dataType = this.getInputValue(document.getElementById('mass-add-type'));
        const textData = document.getElementById('text-import-data').value.trim();
        if (!textData) { this.showToast("Text area is empty.", true); return; }

        let newData = {};
        try {
            // First, always try to parse as pure JSON
            newData = JSON.parse(textData);
            this.showToast("JSON format detected and parsed.", false);
        } catch (jsonError) {
            // If JSON parsing fails, use the strategy pattern for text formats
            const parsingStrategies = {
                zones: this.parseZoneText,
                gems: this.parseMultiLevelKeyValue,
                accessories: this.parseMultiLevelKeyValue,
                jewelry: this.parseMultiLevelKeyValue,
                equipment: this.parseMultiLevelKeyValue,
                // The generic parser is the fallback for simple key-value structures
                default: this.parseGenericKeyValue,
            };

            const parser = parsingStrategies[dataType] || parsingStrategies.default;
            try {
                newData = parser.call(this, textData);
            } catch (textError) {
                console.error("Text Parsing Error:", textError);
                this.showToast(`An error occurred during text parsing: ${textError.message}`, true);
                return;
            }
        }
        
        const count = Object.keys(newData).length;
        if (count > 0) {
            // Instead of replacing, merge the new data with existing data.
            // This allows for both adding new items and updating existing ones.
            const targetData = DataManager.GDD[dataType];
            if (typeof targetData === 'object' && !Array.isArray(targetData)) {
                 Object.assign(targetData, newData);
            } else {
                // If the target isn't an object (e.g., array or undefined), replace it.
                DataManager.GDD[dataType] = newData;
            }

            this.showToast(`Successfully imported/updated ${count} entries for ${dataType}.`);
            if (this.activePath[0] === dataType) this.navigateToPath([dataType]);
        } else {
            this.showToast("Parsing failed. No data was imported. Check format.", true);
        }
    },
    
    parseGenericKeyValue(text) {
        const data = {};
        const lines = text.split('\n');
        for (const line of lines) {
            if (!line.trim() || line.startsWith('#')) continue;

            const separatorIndex = line.indexOf(':');
            if (separatorIndex === -1) continue;

            let key = line.substring(0, separatorIndex).trim();
            // Create a javascript-friendly key (e.g., "Clan Creation Cost" -> "clanCreationCost")
            key = key.replace(/\s\(.*?\)/g, '').replace(/\s+/g, '_').toUpperCase();

            let value = line.substring(separatorIndex + 1).trim();

            // Intelligent Type Coercion
            if (!isNaN(value) && value.trim() !== '') {
                value = parseFloat(value); // It's a number
            } else if (value.toLowerCase() === 'true' || value.toLowerCase() === 'false') {
                value = (value.toLowerCase() === 'true'); // It's a boolean
            } else {
                try {
                    value = JSON.parse(value); // It might be an array or object string
                } catch (e) {
                    // It's just a string
                }
            }
            data[key] = value;
        }
        return data;
    },

    parseMultiLevelKeyValue(text) {
        const data = {};
        let currentSubKey = null;
        text.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            if (line.startsWith('#')) {
                currentSubKey = line.substring(1).trim();
                if (!data[currentSubKey]) data[currentSubKey] = {};
                return;
            }
            const separatorIndex = line.indexOf(':');
            if (separatorIndex === -1 || !currentSubKey) return;
            const key = line.substring(0, separatorIndex).trim();
            const value = line.substring(separatorIndex + 1).trim();
            try { data[currentSubKey][key] = JSON.parse(value); } 
            catch (e) { data[currentSubKey][key] = value; }
        });
        return data;

// 1. LISTEN: Receive Data from Map Maker Iframe
window.addEventListener('message', (event) => {
    // Filter for our specific Save Command
    if (event.data && event.data.type === 'GEMINUS_SAVE_ZONE') {
        const zoneData = event.data.payload;
        console.log("[DevTools] Received Zone Data:", zoneData.zid);

        // A. Save to Global Data (Adjust 'App.GDD_DATA' if you use a different store)
        // Assuming you have a zones object in your data:
        if (!window.App) window.App = {}; 
        if (!window.App.GDD_DATA) window.App.GDD_DATA = {};
        if (!window.App.GDD_DATA.zones) window.App.GDD_DATA.zones = {};

        // Update the specific zone
        window.App.GDD_DATA.zones[zoneData.zid] = zoneData;

        // B. Update UI (Toast/Refresh)
        if (typeof showToast === 'function') {
            showToast(`Map ${zoneData.zid} Synced Successfully!`);
        } else {
            alert(`Map ${zoneData.zid} Synced!`);
        }

        // C. Refresh Zone List (If you have a function to render the list)
        if (typeof renderZoneList === 'function') renderZoneList();
    }
});

// 2. SEND: Open Map Maker with Zone Data
function openMapEditor(zoneId) {
    // A. Get Data
    const zoneData = window.App.GDD_DATA.zones[zoneId];
    
    // B. Find Iframe
    // IMPORTANT: Ensure your <iframe> has id="map-maker-frame"
    const iframe = document.getElementById('map-maker-frame'); 
    
    if (!iframe) {
        console.error("Map Maker Iframe not found! Check ID='map-maker-frame'");
        return;
    }

    // C. Send Data (Delay slightly to ensure iframe is ready)
    setTimeout(() => {
        iframe.contentWindow.postMessage({
            type: 'GEMINUS_LOAD_ZONE',
            payload: zoneData
        }, '*');
        console.log(`[DevTools] Sent ${zoneId} to Editor`);
    }, 500);
}
</script>
