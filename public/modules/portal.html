<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geminus - Teleportation Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --panel-bg: rgba(20, 25, 50, 0.2);
            --panel-border: rgba(255, 255, 255, 0.2);
            --highlight-light: rgba(255, 255, 255, 0.3);
            --shadow-dark: rgba(0, 0, 0, 0.4);
            --text-primary: #f0f8ff;
            --accent-color: #89ddff;
            --accent-color-hover: #b0eaff;
            --header-accent: #ffd700;
            --text-shadow-color: rgba(0, 0, 0, 0.5);
            --panel-blur: 12px;
            --panel-radius: 16px;
            --liquid-filter: url(#liquid-distortion);
        }

        html, body { height: 100%; overflow: hidden; }
        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-primary);
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(var(--panel-blur));
            -webkit-backdrop-filter: blur(var(--panel-blur));
            border: 1px solid var(--panel-border);
            border-radius: var(--panel-radius);
            box-shadow: 
                inset 1px 1px 2px 0 var(--highlight-light),
                inset -1px -1px 2px 0 var(--shadow-dark);
        }

        .glass-button {
            background: rgba(137, 221, 255, 0.15);
            border: 1px solid rgba(137, 221, 255, 0.4);
            color: var(--accent-color);
            transition: all 0.2s ease-in-out;
            border-radius: 0.5rem;
            text-shadow: 1px 1px 2px var(--text-shadow-color);
        }
        .glass-button:not(:disabled):hover {
            background: rgba(137, 221, 255, 0.3);
            border-color: var(--accent-color-hover);
            transform: translateY(-1px);
        }
        .glass-button:disabled {
            background: rgba(50, 50, 50, 0.3);
            border-color: rgba(100, 100, 100, 0.5);
            color: rgba(202, 233, 234, 0.5);
            cursor: not-allowed;
        }
        .glass-button.active {
            background: rgba(137, 221, 255, 0.4);
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(137, 221, 255, 0.5);
        }

        .teleport-list-item {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid transparent;
            border-radius: calc(var(--panel-radius) / 2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .teleport-list-item:hover, .teleport-list-item.selected {
            background-color: rgba(137, 221, 255, 0.15);
            border-color: var(--accent-color);
            transform: translateX(4px);
        }
        
        /* Fixed scrollbar and container sizing */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--panel-border); border-radius: 3px; }
        
        /* Prevents the panel from vanishing when empty */
        #teleport-control-panel {
            min-height: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #teleport-control-panel.minimized {
            height: 48px;
            padding-top: 12px;
        }
        .header-title { 
            color: var(--header-accent); 
            text-shadow: 1px 1px 3px var(--text-shadow-color), 0 0 12px var(--header-accent); 
            filter: var(--liquid-filter); 
        }

        .hub-tab {
            border-bottom: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.2s ease;
        }
        .hub-tab.active {
            border-bottom-color: var(--accent-color);
            opacity: 1;
        }

        #event-ticker-container {
            flex-shrink: 0;
            background-color: rgba(0,0,0,0.3);
            overflow: hidden;
            white-space: nowrap;
        }
        #event-ticker-content {
            display: inline-block;
            animation: scroll-ticker 30s linear infinite;
        }
        @keyframes scroll-ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        .event-icon {
            animation: pulse-icon 2s infinite ease-in-out;
        }
        
        .filter-input {
            background-color: rgba(0,0,0,0.4);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
        }
        .favorite-btn {
            opacity: 0.5;
            transition: all 0.2s ease;
        }
        .favorite-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .favorite-btn.is-favorite {
            opacity: 1;
            color: var(--header-accent);
        }
        /* In style block */
        .toast-notification {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(34, 211, 238, 0.2);
            border: 1px solid #22d3ee;
            color: #22d3ee;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            opacity: 0;
            transition: all 0.3s ease-out;
            pointer-events: none;
            z-index: 1000;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        

    </style>
</head>
<body class="flex items-center justify-center">

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="liquid-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.03" numOctaves="1" result="warp" />
            <feDisplacementMap xChannelSelector="R" yChannelSelector="G" scale="4" in="SourceGraphic" in2="warp" />
        </filter>
    </svg>

    <div id="teleport-modal" class="glass-panel rounded-lg w-full max-w-lg h-[95vh] max-h-[800px] flex flex-col p-4 m-4">
        <div class="flex justify-between items-center mb-2 flex-shrink-0">
            <h1 class="font-cinzel text-3xl header-title text-on-glass">Teleportation Hub</h1>
            <button id="teleport-close-btn" class="text-3xl leading-none text-on-glass opacity-70 hover:opacity-100">&times;</button>
        </div>

        <div id="event-ticker-container" class="rounded-md p-1 mb-3 text-xs">
            <div id="event-ticker-content" class="text-on-glass"></div>
        </div>

        <div class="flex border-b border-white/10 mb-3 flex-shrink-0">
            <button id="tab-destinations" class="hub-tab flex-1 py-2 text-on-glass active">Destinations</button>
            <button id="tab-network" class="hub-tab flex-1 py-2 text-on-glass">Network</button>
        </div>

        <div id="content-destinations" class="flex flex-col flex-grow min-h-0">
             <div class="panel flex-shrink-0 glass-panel border-0 shadow-none bg-black/20 p-0 mb-3">
                <div id="filter-controls" class="p-3 border-b border-white/10 space-y-2">
                    <input type="text" id="search-input" class="filter-input w-full px-3 py-1 text-sm" placeholder="Search by name...">
                    <div class="flex gap-2">
                        <select id="sort-select" class="filter-input flex-grow px-2 py-1 text-xs">
                            <option value="level-asc">Level (Asc)</option>
                            <option value="level-desc">Level (Desc)</option>
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="gem">Gem Zones</option>
                            <option value="gold">Gold Zones</option>
                            <option value="shadow">Shadow Zones</option>
                        </select>
                        <button id="toggle-favorites-btn" class="glass-button px-3 text-xs">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="teleport-list-container" class="flex-grow min-h-0 overflow-y-auto custom-scrollbar p-1 space-y-2"></div>

            <div id="teleport-control-panel" class="panel p-4 flex-shrink-0 text-center space-y-3 bg-black/40 mt-auto relative border-t border-white/10 rounded-t-xl">
    <button id="minimize-intel-btn" class="absolute top-2 right-4 text-gray-500 hover:text-cyan-400 z-10 transition-colors">
        <svg id="minimize-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
    
    <div id="intel-details-container" class="transition-opacity duration-200">
        <p class="text-[10px] text-gray-500 uppercase tracking-tighter">Aetheric Signature Detected</p>
        <h3 id="selected-zone-name" class="font-cinzel text-2xl text-accent-color text-on-glass">-</h3>
        
        <div id="zone-intelligence-panel" class="text-xs text-gray-300 grid grid-cols-2 gap-x-4 gap-y-1 mt-2 text-left max-w-sm mx-auto">
            </div>
        
        <p id="teleport-cost-display" class="text-sm text-yellow-400 mt-3 font-bold">&nbsp;</p>
        <button id="teleport-button" class="glass-button w-full font-cinzel tracking-wider text-on-glass py-3 mt-2" disabled>Initiate Warp</button>
    </div>
</div>
        </div>

        <div id="content-network" class="flex-col flex-grow min-h-0 hidden">
            <div class="panel flex-grow flex flex-col overflow-y-auto custom-scrollbar glass-panel border-0 shadow-none bg-black/20 p-3 space-y-4">
                <div class="text-center">
                    <p class="text-sm text-gray-400">Available Aetherium Shards</p>
                    <p id="player-shards" class="font-bold text-2xl text-accent-color">0</p>
                </div>
                <div id="network-perks-container" class="space-y-3"></div>
            </div>
        </div>
    </div>
    
<script type="module">
    // Cloudflare Fix: Removed /src/ imports. Data now streams dynamically from manifest and window.parent.
    
    const PortalManager = {
        gm: null,
        player: null,
        eventIcons: {
            HORDE: `<svg class="w-3 h-3 text-red-400 event-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`,
            SURGE: `<svg class="w-3 h-3 text-purple-400 event-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M4 17v4M2 19h4M17 4v4M16 6h4M20 17v4M19 19h4M12 9a3 3 0 100-6 3 3 0 000 6zm0 12a3 3 0 100-6 3 3 0 000 6zm0-3a3 3 0 100-6 3 3 0 000 6z"></path></svg>`
        },
        filters: { search: '', sort: 'level-asc', showFavorites: false },
        zoneCache: {},
        notifiedEvents: new Set(),
        isMinimized: false,

        async init(player) {
            this.player = player;
            this.gm = window.parent.gameManager;
            
            // Fetch the manifest dynamically
            try {
                const res = await fetch('../data/zones/manifest.json');
                this.zoneCache = await res.json();
            } catch(e) {
                console.error("Portal: Failed to load manifest", e);
                this.zoneCache = {};
            }
            
            this.renderZoneList();
            
            document.getElementById('minimize-intel-btn')?.addEventListener('click', () => this.toggleMinimize());

            document.getElementById('search-input')?.addEventListener('input', (e) => {
                this.filters.search = e.target.value;
                this.renderZoneList();
            });

            document.getElementById('sort-select')?.addEventListener('change', (e) => {
                this.filters.sort = e.target.value;
                this.renderZoneList();
            });

            document.getElementById('toggle-favorites-btn')?.addEventListener('click', () => {
                this.filters.showFavorites = !this.filters.showFavorites;
                document.getElementById('toggle-favorites-btn').classList.toggle('active', this.filters.showFavorites);
                this.renderZoneList();
            });

            document.getElementById('tab-network')?.addEventListener('click', () => this.switchTab('network'));
            document.getElementById('tab-destinations')?.addEventListener('click', () => this.switchTab('destinations'));
            
            this.updateEventTicker();
            setInterval(() => {
                this.updateEventTicker();
                this.checkNewEvents(); 
                const selectedName = document.getElementById('selected-zone-name').innerText;
                if (selectedName !== '-') {
                    const zonesArray = Object.keys(this.zoneCache).map(key => ({ id: key, ...this.zoneCache[key] }));
                    const currentZone = zonesArray.find(z => z.zoneName === selectedName);
                    if (currentZone) this.selectZone(currentZone.id, currentZone, this.player.level < currentZone.minLevel, false);
                }
            }, 1000);
        },

        renderZoneList() {
            const container = document.getElementById('teleport-list-container');
            if (!container) return;
            container.innerHTML = ''; 

            const zonesArray = Object.keys(this.zoneCache).map(key => ({
                id: key,
                ...this.zoneCache[key]
            }));

            let filtered = zonesArray.filter(zone => {
                if (zone.id === 'ZMW00') return false;
                const matchesSearch = !this.filters.search || zone.zoneName.toLowerCase().includes(this.filters.search.toLowerCase());
                const isFav = this.player.favoriteZones?.includes(zone.id);
                const matchesFav = !this.filters.showFavorites || isFav;
                return matchesSearch && matchesFav;
            });

            filtered.sort((a, b) => {
                if (this.filters.sort === 'level-desc') return b.minLevel - a.minLevel;
                if (this.filters.sort === 'name-asc') return a.zoneName.localeCompare(b.zoneName);
                return a.minLevel - b.minLevel;
            });

            const fragment = document.createDocumentFragment();
            filtered.forEach(zone => {
                const isFav = this.player.favoriteZones?.includes(zone.id);
                const isLocked = this.player.level < zone.minLevel;
                const isSelected = zone.id === this.currentSelectedId;

                const activeEvents = window.parent.game?.worldEvents || [];
                const activeEvent = activeEvents.find(e => e.zoneId === zone.id && e.expires > Date.now());
                const eventIcon = activeEvent ? this.eventIcons[activeEvent.type] || '' : '';

                const card = document.createElement('div');
                card.className = `teleport-list-item p-3 mb-2 rounded border transition-all cursor-pointer ${
                    isSelected ? 'bg-cyan-900/40 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.2)]' : 
                    isLocked ? 'opacity-40 bg-red-900/10 border-red-900/30' : 'bg-blue-900/20 border-blue-500/50 hover:bg-blue-900/40'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <button class="favorite-btn ${isFav ? 'text-yellow-400' : 'text-gray-400 opacity-50'}" 
                                    onclick="event.stopPropagation(); window.PortalManager.toggleFav('${zone.id}')">★</button>
                            <div class="flex flex-col">
                                <span class="text-xs font-cinzel ${isSelected ? 'text-white' : 'text-cyan-400'} uppercase flex items-center gap-2">
                                    ${zone.zoneName} ${eventIcon}
                                </span>
                                <span class="text-[9px] text-gray-500">REQ LVL: ${zone.minLevel} | ${zone.type}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            ${isSelected ? '<span class="text-[8px] font-bold text-cyan-400 tracking-tighter">CURRENT TARGET</span>' : ''}
                            ${isLocked ? '<span>🔒</span>' : ''}
                        </div>
                    </div>
                `;

                card.onclick = async () => {
                    this.currentSelectedId = zone.id;
                    this.renderZoneList(); 
                    
                    try {
                        const zoneRes = await fetch(`../data/zones/${zone.id}_master.json`);
                        if (!zoneRes.ok) throw new Error("File not found");
                        const fullMapData = await zoneRes.json();
                        this.selectZone(zone.id, fullMapData, isLocked, true);
                    } catch (e) {
                        this.selectZone(zone.id, zone, isLocked, true);
                    }
                };
                fragment.appendChild(card);
            });
            
            container.appendChild(fragment);
        },

        toggleMinimize() {
            const panel = document.getElementById('teleport-control-panel');
            const icon = document.getElementById('minimize-icon');
            const intelGrid = document.getElementById('zone-intelligence-panel');
            const costDisplay = document.getElementById('teleport-cost-display');
            const warpBtn = document.getElementById('teleport-button');
            
            if (this.gm?.playMagiTechSound) {
                this.gm.playMagiTechSound('ui_click_heavy');
            }

            const isMinimized = panel.classList.toggle('h-12');
            this.isMinimized = isMinimized;
            
            if (isMinimized) {
                intelGrid.classList.add('hidden');
                costDisplay.classList.add('hidden');
                warpBtn.classList.add('hidden'); 
                icon.style.transform = 'rotate(180deg)';
                panel.classList.remove('p-4');
                panel.classList.add('p-1'); 
            } else {
                intelGrid.classList.remove('hidden');
                costDisplay.classList.remove('hidden');
                warpBtn.classList.remove('hidden'); 
                icon.style.transform = 'rotate(0deg)';
                panel.classList.remove('p-1');
                panel.classList.add('p-4');
            }
        },

        selectZone(zid, zoneData, isLocked, forceExpand = false) {
            const panel = document.getElementById('teleport-control-panel');
            const intelPanel = document.getElementById('zone-intelligence-panel');
            const zoneTitle = document.getElementById('selected-zone-name');
            const costDisplay = document.getElementById('teleport-cost-display');
            const warpBtn = document.getElementById('teleport-button');

            panel.classList.remove('hidden');

            if (forceExpand || (this.isMinimized && zid !== this.currentSelectedId)) {
                if (this.isMinimized) {
                    this.toggleMinimize();
                }
            }
            this.currentSelectedId = zid;

            const zoneMeta = this.zoneCache[zid] || zoneData;
            const parentBestiary = window.parent.bestiaryData || {}; 
            const monsterPool = zoneData.zoneMobs || [];
            let apexThreat = null;
            
            monsterPool.forEach(mId => {
                const mData = parentBestiary[mId];
                if (mData && (!apexThreat || mData.level > apexThreat.level)) {
                    apexThreat = mData;
                }
            });

            const activeEvents = window.parent.game?.worldEvents || [];
            const event = activeEvents.find(e => e.zoneId === zid && e.expires > Date.now());
            let eventHtml = '';
            if (event) {
                const timeStr = this.formatTimeRemaining(event.expires - Date.now());
                eventHtml = `
                    <div class="col-span-2 mt-2 pt-2 border-t border-white/10">
                        <p class="text-[9px] text-yellow-400 font-bold uppercase flex items-center gap-1">
                            ${this.eventIcons[event.type] || ''} ${event.title}
                        </p>
                        <p class="text-[9px] text-cyan-400 font-mono">TIME: ${timeStr}</p>
                    </div>`;
            }

            let threatHtml = apexThreat ? `
                <div class="col-span-2 mt-2 pt-2 border-t border-white/10">
                    <p class="text-[9px] text-red-500 font-bold uppercase tracking-widest">Apex Threat</p>
                    <div class="flex justify-between items-center text-white">
                        <span class="font-bold">${apexThreat.name}</span>
                        <span class="text-red-400 font-mono">Lvl ${apexThreat.level}</span>
                    </div>
                </div>` : '';

            const playerPower = (this.player.stats.wc * 2) + this.player.stats.ac; 
            const zoneThreat = (apexThreat ? apexThreat.level * 100 : (zoneData.minLevel * 50));
            const ratio = playerPower / zoneThreat;
            let diff = ratio > 3.0 ? {t: "TRIVIAL", c: "text-green-400"} : ratio > 1.5 ? {t: "MANAGEABLE", c: "text-sky-300"} : ratio >= 0.9 ? {t: "CHALLENGING", c: "text-yellow-400"} : {t: "LETHAL", c: "text-red-500"};

            zoneTitle.innerText = zoneData.zoneName || zid;
            intelPanel.innerHTML = `
                <span class="opacity-60">Req. Lvl:</span> <span class="font-bold text-white">${zoneData.minLevel || 1}</span>
                <span class="opacity-60">Resonance:</span> <span class="font-bold ${diff.c}">${diff.t}</span>
                <span class="opacity-60">Zone Type:</span> <span class="text-cyan-300">${zoneMeta?.type || 'Standard'}</span>
                <span class="opacity-60">Status:</span> <span class="text-green-400">Attuned</span>
                ${eventHtml}
                ${threatHtml}
            `;

            const baseCost = 10000 + ((zoneData.minLevel || 1) * 50);
            const discount = (this.player.teleportNetwork?.costReduction || 0) * 0.05;
            const cost = Math.floor(baseCost * (1 - discount));
            
            costDisplay.innerText = isLocked ? `LEVEL TOO LOW` : `Cost: ${cost.toLocaleString()} Gold`;
            warpBtn.disabled = isLocked;
            warpBtn.onclick = () => {
                if (confirm(`⚡ INITIATE WARP SEQUENCE?\nTarget: ${zoneData.zoneName}\nCost: ${cost.toLocaleString()} Gold`)) {
                    this.executeTeleport(zid, zoneData, cost);
                }
            };
        },

        executeTeleport(zid, zoneData, cost) {
            const targetX = (zoneData.spawnPoints && zoneData.spawnPoints.length > 0) ? zoneData.spawnPoints[0].x : 10;
            const targetY = (zoneData.spawnPoints && zoneData.spawnPoints.length > 0) ? zoneData.spawnPoints[0].y : 10;

            if (this.gm) {
                if (!window.parent.DEV_FREE_WARP) this.player.gold -= cost;

                if (this.gm.triggerTeleportEffect) {
                    this.gm.triggerTeleportEffect(zoneData.zoneName, () => {
                        if (this.gm.ZoneManager) {
                            this.gm.ZoneManager.handleZoneTransition(zid, targetX, targetY);
                        }
                        const overlay = window.parent.document.getElementById('module-overlay');
                        if (overlay) overlay.classList.add('hidden');
                    });
                } else {
                    if (this.gm.ZoneManager) this.gm.ZoneManager.handleZoneTransition(zid, targetX, targetY);
                }
            }
        }, 

        toggleFav(zid) {
            if (!this.player.favoriteZones) this.player.favoriteZones = [];
            const idx = this.player.favoriteZones.indexOf(zid);
            if (idx > -1) this.player.favoriteZones.splice(idx, 1);
            else this.player.favoriteZones.push(zid);
            this.renderZoneList(); 
        },

        switchTab(tab) {
            const isDest = tab === 'destinations';
            if (!isDest) document.getElementById('teleport-control-panel').classList.add('hidden');
            document.getElementById('tab-destinations').classList.toggle('active', isDest);
            document.getElementById('tab-network').classList.toggle('active', !isDest);
            document.getElementById('content-destinations').classList.toggle('hidden', !isDest);
            document.getElementById('content-network').classList.toggle('hidden', isDest);
            document.getElementById('content-network').classList.toggle('flex', !isDest);
            
            if (!isDest) {
                this.renderNetworkTab();
            }
        },

        upgradePerk(perkId) {
            const perk = {
                costReduction: { name: 'Aetheric Efficiency', baseCost: 100 }
            }[perkId];

            if (!perk) return;

            const currentRank = this.player.teleportNetwork?.[perkId] || 0;
            const cost = perk.baseCost * (currentRank + 1);

            const isDevMode = true; 

            if (isDevMode || this.player.aetheriumShards >= cost) {
                if (!isDevMode) this.player.aetheriumShards -= cost;
                
                if (!this.player.teleportNetwork) this.player.teleportNetwork = {};
                this.player.teleportNetwork[perkId] = currentRank + 1;
                
                if (this.gm?.playMagiTechSound) this.gm.playMagiTechSound('ui_upgrade_success');
                this.renderNetworkTab();
                
                const newDiscount = (currentRank + 1) * 5;
                this.showToast(`${perk.name} Rank ${currentRank + 1}: Total Discount ${newDiscount}%`);
            } else {
                if (this.gm?.playMagiTechSound) this.gm.playMagiTechSound('ui_error');
                alert("Insufficient Aetherium Shards!");
            }
        },

        showToast(message) {
            let toast = document.getElementById('portal-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'portal-toast';
                toast.className = 'toast-notification';
                document.getElementById('teleport-modal').appendChild(toast);
            }
            
            toast.textContent = `✦ ${message.toUpperCase()}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4500);
        },

        formatTimeRemaining(ms) {
            if (ms <= 0) return "Expired";
            const totalSeconds = Math.floor(ms / 1000);
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        },

        updateEventTicker() {
            const tickerContent = document.getElementById('event-ticker-content');
            if (!tickerContent) return;

            const activeEvents = window.parent.game?.worldEvents || [];
            
            if (activeEvents.length > 0) {
                tickerContent.innerHTML = activeEvents.map(event => `
                    <span class="mx-4 font-semibold text-cyan-400">
                        <span class="text-yellow-400">✦</span> ${event.title}: ${event.description}
                    </span>
                `).join('<span class="text-gray-500 mx-2">|</span>');
                tickerContent.parentElement.style.display = 'block';
            } else {
                tickerContent.innerHTML = '<span class="mx-4 text-gray-500 italic">No active aetheric surges detected...</span>';
            }
        },

        checkNewEvents() {
            const activeEvents = window.parent.game?.worldEvents || [];
            
            activeEvents.forEach(event => {
                if (!this.notifiedEvents.has(event.id)) {
                    this.notifiedEvents.add(event.id);

                    if (this.gm?.playMagiTechSound) {
                        const soundType = event.type === 'HORDE' ? 'event_horde_start' : 'event_surge_start';
                        this.gm.playMagiTechSound(soundType);
                    }

                    this.showToast(`NEW WORLD EVENT: ${event.title}`);
                }
            });

            const activeIds = activeEvents.map(e => e.id);
            this.notifiedEvents.forEach(id => {
                if (!activeIds.includes(id)) this.notifiedEvents.delete(id);
            });
        },

        renderNetworkTab() {
            const container = document.getElementById('network-perks-container');
            const shardDisplay = document.getElementById('player-shards');
            if (!container || !shardDisplay) return;

            shardDisplay.textContent = (this.player.aetheriumShards || 0).toLocaleString();
            
            const perks = [
                { id: 'costReduction', name: 'Aetheric Efficiency', desc: 'Reduces Gold cost of all warps.', bonus: '5%' }
            ];

            container.innerHTML = perks.map(perk => {
                const currentRank = this.player.teleportNetwork?.[perk.id] || 0;
                const currentDiscount = currentRank * 5;
                
                return `
                <div class="bg-black/40 p-3 rounded border border-white/10">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-cyan-400 font-bold text-xs uppercase">${perk.name}</p>
                            <p class="text-[10px] text-gray-400">${perk.desc}</p>
                            <div class="flex gap-3 mt-1">
                                <p class="text-[10px] text-yellow-500 font-bold">RANK: ${currentRank}</p>
                                <p class="text-[10px] text-green-400 font-bold">DISCOUNT: ${currentDiscount}%</p>
                            </div>
                        </div>
                        <button class="glass-button px-3 py-1 text-[10px]" onclick="window.PortalManager.upgradePerk('${perk.id}')">Upgrade</button>
                    </div>
                </div>
            `}).join('');
        }
    };

    window.PortalManager = PortalManager; 
    window.ShopManager = { init: (player) => PortalManager.init(player) };
</script>
</body>
</html>
