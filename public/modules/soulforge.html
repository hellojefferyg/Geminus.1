<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
   <title>Geminus - Soulforge</title>
   
   <script src="https://cdn.tailwindcss.com"></script>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
   
   <style>
       :root {
           --bg-color: #000000;
           --accent-cyan: #00ffff;
           --panel-bg: rgba(10, 30, 35, 0.1); 
           --panel-border: rgba(0, 255, 255, 0.2);
           --text-primary: #ffffff;
           --text-secondary: #bae6fd;
           --accent-orange: #f5a623;
           --accent-red: #ff4d4d;
           --accent-ascended: #ffd700;
           --text-affordable: #a7f3d0;
           --text-unaffordable: #fda4af;
           --stat-highlight-bg: rgba(0, 255, 255, 0.1);
           --stat-increase-color: #4ade80; /* Green */
           --stat-decrease-color: #f87171; /* Red */
       }
       html, body { height: 100%; }
       body { 
           font-family: 'Inter', sans-serif; 
           background-color: var(--bg-color); 
           color: var(--text-primary); 
           text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
       }
       .font-cinzel { font-family: 'Cinzel', serif; }
       .main-container { 
           max-width: 420px; 
           height: 100%; 
           background-color: #0a0a0a;
           background-image: url('https://i.ibb.co/PpYh19g/IMG-1903.jpg');
           background-size: cover;
           background-position: center;
       }
       #app-content {
           padding-bottom: 90px; /* Space for the fixed footer */
       }
       .header { background-color: rgba(0,0,0,0.5); border-bottom: 1px solid var(--panel-border); }
       .header-title { color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan), 0 1px 3px rgba(0, 0, 0, 0.7); }
       .panel { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--panel-border); border-radius: 0.5rem; }
       .stat-row { border-bottom: 1px solid var(--panel-border); transition: background-color 0.2s; }
       .stat-row:last-child { border-bottom: none; }
       .stat-row.selectable:hover { background-color: var(--stat-highlight-bg); cursor: pointer; }
       .stat-row.selected { background-color: var(--stat-highlight-bg); outline: 1px solid var(--accent-cyan); outline-offset: -1px; }
       .cost-item-compact { background-color: rgba(0,0,0,0.4); border-radius: 0.5rem; border: 1px solid var(--panel-border); }
       .inventory-slot { position: relative; border-radius: 0.5rem; border: 2px solid var(--panel-border); background-color: rgba(0,0,0,0.4); }
       .inventory-slot.ascended { border-color: var(--accent-ascended); box-shadow: 0 0 12px var(--accent-ascended); }
       .action-button, .secondary-action-button { background: rgba(0, 255, 255, 0.1); border: 1px solid var(--panel-border); border-radius: 0.75rem; color: var(--accent-cyan); font-weight: 700; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); transition: all 0.2s ease; }
       .action-button:hover:not(:disabled) { background: rgba(0, 255, 255, 0.2); border-color: var(--accent-cyan); }
       .secondary-action-button { background: rgba(0, 150, 150, 0.2); font-size: 0.875rem; padding: 0.5rem 1rem; }
       .secondary-action-button:hover:not(:disabled) { background: rgba(0, 200, 200, 0.3); }
       .action-button.shatter-mode, .secondary-action-button.shatter-mode, .modal-confirm-btn.shatter-mode { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); text-shadow: 0 0 5px rgba(255, 77, 77, 0.5); border-color: rgba(255, 77, 77, 0.5); }
       .action-button.shatter-mode:hover:not(:disabled), .secondary-action-button.shatter-mode:hover:not(:disabled), .modal-confirm-btn.shatter-mode:hover:not(:disabled) { background: rgba(255, 77, 77, 0.2); border-color: var(--accent-red); }
       .action-button.ascension-mode, .modal-confirm-btn.ascension-mode { background: rgba(255, 215, 0, 0.1); color: var(--accent-ascended); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); border-color: rgba(255, 215, 0, 0.5); }
       .action-button.ascension-mode:hover:not(:disabled), .modal-confirm-btn.ascension-mode:hover:not(:disabled) { background: rgba(255, 215, 0, 0.2); border-color: var(--accent-ascended); }
       .action-button:disabled, .secondary-action-button:disabled { background: rgba(60, 60, 60, 0.4); border-color: rgba(100, 100, 100, 0.8); cursor: not-allowed; color: #6b7280; text-shadow: none; }
       .tab-nav-button { color: var(--text-secondary); transition: all 0.2s ease; border-bottom: 3px solid transparent; }
       .tab-nav-button.active { color: var(--accent-orange); border-bottom-color: var(--accent-orange); }
       .custom-input, .custom-select { background-color: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); border-radius: 0.25rem; padding: 0.5rem; color: var(--text-primary); }
       .custom-select option { background-color: #0a1e23; color: var(--text-primary); }
       
       @keyframes flash { 50% { box-shadow: 0 0 15px 5px var(--flash-color); border-color: var(--flash-color); } }
       .animate-flash { animation: flash 0.5s ease-out; }
 
       @keyframes critical-success { 0% { opacity: 1; transform: scale(0.5); } 50% { transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.5); } }
       #critical-success-message.animate { animation: critical-success 1.5s ease-out forwards; }
       
       .tier-checkbox { display: none; }
       .tier-checkbox + label { display: flex; align-items: center; justify-content: center; border: 1px solid var(--panel-border); padding: 0.5rem; width: 4rem; height: 2.5rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s ease; text-align: center; }
       .tier-checkbox:checked + label { background-color: var(--accent-red); color: black; font-weight: bold; border-color: var(--accent-red); }
   </style>
</head>
<body class="bg-black flex justify-center">
 
   <div id="soulforge-root" class="main-container flex flex-col">
       <header class="header p-4 text-center flex-shrink-0">
           <h1 id="page-title" class="font-cinzel text-2xl header-title">The Soulforge</h1>
       </header>
 
       <main id="app-content" class="flex-grow overflow-y-auto">
           <div id="page-content" class="p-4 space-y-4">
               <div class="panel p-4">
                   <div class="flex items-center gap-4 mb-3 border-b border-gray-700 pb-3">
                       <div id="selected-item-icon" class="inventory-slot w-16 h-16 p-1 flex-shrink-0 bg-black/60">
                           <div id="critical-success-message" class="absolute inset-0 flex items-center justify-center text-xs font-bold text-yellow-300 pointer-events-none opacity-0" style="text-shadow: 0 0 5px black;"></div>
                       </div>
                       <div class="flex-grow">
                           <h2 id="selected-item-name" class="font-bold text-orange-400 text-lg font-cinzel leading-tight"></h2>
                           <div id="selected-item-type-tier" class="text-xs text-gray-400"></div>
                       </div>
                   </div>
                   <div class="bg-black/50 p-3 rounded border border-gray-700">
                       <p id="primary-stat-display" class="text-sm font-bold text-cyan-300 mb-2 border-b border-gray-700 pb-1"></p>
                       <div id="selected-item-stats" class="flex flex-col gap-1"></div>
                   </div>
                   <div id="item-interaction-panel" class="mt-4 pt-4 border-t border-dashed border-gray-600"></div>
               </div>
 
               <nav class="flex text-light flex-shrink-0 panel p-1">
                   <button data-page="infusion" class="nav-button tab-nav-button active flex-1 py-2 text-center text-sm">Infusion</button>
                   <button data-page="rerolling" class="nav-button tab-nav-button flex-1 py-2 text-center text-sm">Rerolling</button>
                   <button data-page="ascension" class="nav-button tab-nav-button flex-1 py-2 text-center text-sm">Ascension</button>
                   <button data-page="shatter" class="nav-button tab-nav-button flex-1 py-2 text-center text-sm">Shatter</button>
               </nav>
 
               <div class="panel p-4">
                    <div id="inventory-controls" class="flex flex-col gap-2 mb-3 bg-black/40 p-2 rounded border border-gray-700">
                        <div class="flex justify-between items-center gap-2">
                            <input type="text" id="inventory-search" class="w-full bg-gray-900 text-cyan-100 text-xs p-2 rounded border border-gray-600 focus:border-cyan-500 outline-none font-mono" placeholder="Search item name...">
                            <select id="inventory-sort" class="custom-select w-1/3 text-xs p-2">
                                <option value="primaryStat">Sort: Power</option>
                                <option value="name">Sort: Name</option>
                            </select>
                            <div id="secondary-action-container" class="w-1/4"></div>
                        </div>
                        <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-1" id="filter-tabs">
                            <button class="filter-tab-btn px-2 py-1 rounded text-[10px] font-bold uppercase border bg-cyan-700 text-white border-cyan-500 shadow-[0_0_8px_rgba(34,211,238,0.3)]" data-filter="all">All</button>
                            <button class="filter-tab-btn px-2 py-1 rounded text-[10px] font-bold uppercase border bg-gray-800 text-gray-400 border-gray-600 hover:bg-gray-700" data-filter="weapon">Weapons</button>
                            <button class="filter-tab-btn px-2 py-1 rounded text-[10px] font-bold uppercase border bg-gray-800 text-gray-400 border-gray-600 hover:bg-gray-700" data-filter="armor">Armor</button>
                            <button class="filter-tab-btn px-2 py-1 rounded text-[10px] font-bold uppercase border bg-gray-800 text-gray-400 border-gray-600 hover:bg-gray-700" data-filter="jewelry">Jewelry</button>
                            <button class="filter-tab-btn px-2 py-1 rounded text-[10px] font-bold uppercase border bg-gray-800 text-gray-400 border-gray-600 hover:bg-gray-700" data-filter="spell">Spells</button>
                        </div>
                   </div>
                   <select id="inventory-select" size="6" class="custom-select w-full"></select>
               </div>
               
               <div class="panel p-2">
                   <div class="flex justify-between items-center text-xs mb-1 px-1">
                       <span class="font-bold text-secondary">Crafting Mastery</span>
                       <span id="mastery-level" class="font-bold"></span>
                   </div>
                   <div class="w-full bg-black/50 rounded-full h-2.5 border border-cyan-400/20">
                       <div id="mastery-progress" class="bg-cyan-400 h-full rounded-full transition-all duration-500"></div>
                   </div>
               </div>
           </div>
       </main>
       
       <footer class="p-4 flex-shrink-0 absolute bottom-0 w-full max-w-[420px]">
           <button id="action-button" class="action-button w-full py-3">Infuse</button>
       </footer>
   </div>
   
   <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-75 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
       <div class="panel p-6 rounded-lg shadow-lg max-w-sm w-full">
           <h3 id="modal-title" class="text-xl font-bold font-cinzel text-center mb-4">Confirm Action</h3>
           <p id="modal-message" class="text-center text-secondary mb-6">Are you sure?</p>
           <div class="flex justify-center gap-4">
               <button id="modal-cancel-btn" class="action-button w-full py-2" style="background-color: #4b5563; border-color: #6b7280;">Cancel</button>
               <button id="modal-confirm-btn" class="action-button modal-confirm-btn w-full py-2">Confirm</button>
           </div>
       </div>
   </div>
   
   <div id="bulk-shatter-modal" class="fixed inset-0 bg-black bg-opacity-75 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
       <div class="panel p-6 rounded-lg shadow-lg max-w-md w-full">
           <h3 class="text-xl font-bold font-cinzel text-center mb-4">Bulk Shatter</h3>
           <div id="bulk-shatter-echoes-section" class="mb-6"></div>
           <div class="border-t border-dashed border-gray-600 my-4"></div>
           <div id="bulk-shatter-shadows-section">
               <h4 class="font-bold text-center mb-2 text-orange-300">Shatter Shadows by Tier</h4>
               <div id="bulk-shatter-tier-list" class="grid grid-cols-5 gap-2 mb-4 max-h-48 overflow-y-auto justify-center"></div>
               <div id="bulk-shatter-shadows-summary" class="text-center text-secondary mb-4"></div>
               <button id="bulk-shatter-shadows-btn" class="action-button shatter-mode w-full py-2" disabled>Shatter Selected Tiers</button>
           </div>
           <button id="bulk-shatter-cancel-btn" class="action-button w-full py-2 mt-4" style="background-color: #4b5563; border-color: #6b7280;">Close</button>
       </div>
   </div>
 
<script type="module">
   // --- MOCK DATA & CONFIG ---
   const config = { ASCENSION_MIN_LEVEL: 10, CRITICAL_SUCCESS_CHANCE: 0.05, MASTERY_XP_GAIN: 10, MASTERY_CRITICAL_XP_BONUS: 100, MASTERY_XP_PER_LEVEL: (level) => 100 * Math.pow(1.5, level - 1) };
 
   //================================================================
   // MODULE: State Manager (Engine Synchronized)
   //================================================================
   const StateManager = {
       gm: null,
       _state: { player: null, inventory: [], currentPage: 'infusion', currentItemId: null, selectedStatIndex: -1, filters: { search: '', sort: 'primaryStat', category: 'all' } },
       _onUpdate: () => {},
       
       init(gm, onUpdateCallback) { 
           this.gm = gm;
           this._state.player = this.gm.state.player;
           
           // Ensure resources and mastery objects exist in live engine state
           if (!this._state.player.resources) this._state.player.resources = { essence: 0, primalSouls: 0 };
           if (!this._state.player.mastery) this._state.player.mastery = { level: 1, xp: 0 };
           if (!this._state.player.inventory) this._state.player.inventory = [];
           
           // ENGINE DATA NORMALIZATION:
           // The Soulforge requires specific nested structures (.stats, .forgeType) that the raw engine doesn't use natively.
           this._state.player.inventory.forEach(item => {
               if (item.infusionLevel === undefined) item.infusionLevel = 0;
               if (item.isAscended === undefined) item.isAscended = false;
               
               // Assign a forgeType without overwriting the engine's real item.type
               if (item.type === 'Shadow' || (item.name && item.name.toLowerCase().includes('shadow'))) item.forgeType = 'shadow';
               else if (item.type === 'Echo' || (item.name && item.name.toLowerCase().includes('echo'))) item.forgeType = 'echo';
               else item.forgeType = 'standard';

               // Estimate essence value based on tier and rarity
               if (item.essenceValue === undefined) {
                   item.essenceValue = (item.tier || 1) * (item.forgeType === 'shadow' ? 500 : 100);
               }
               
               // Ensure a nested stats object exists for the Soulforge UI to render
               if (!item.stats) item.stats = {};
               
               // Map base combat stats
               if (item.wc !== undefined) item.stats.wc = item.wc;
               if (item.ac !== undefined) item.stats.ac = item.ac;
               if (item.sc !== undefined) item.stats.sc = item.sc;
               
               // Map flat enchantments from the engine's root item object
               const enchantKeys = ['str', 'dex', 'vit', 'int', 'wis', 'critchance', 'critdamage', 'goldfind', 'expgain'];
               enchantKeys.forEach(key => {
                   if (item[key] !== undefined) item.stats[key] = item[key];
               });

               // [ARCHITECT FIX] Map the engine's 'enchantments' array (Now using Effects!)
               if (Array.isArray(item.enchantments)) {
                   item.enchantments.forEach(ench => {
                       const statKey = ench.effect || ench.name;
                       item.stats[statKey] = `+${ench.value}%`; 
                   });
               }
               // If the engine uses an explicit enchants object, merge it
               if (item.enchants) Object.assign(item.stats, item.enchants);
           });

           this._state.inventory = this._state.player.inventory;
           this._onUpdate = onUpdateCallback; 
       },
       
       syncToEngine() {
           if (this.gm.InventoryManager) this.gm.InventoryManager.refresh();
           if (this.gm.ProfileManager) this.gm.ProfileManager.updateAllProfileUI();
           if (this.gm.UIManager) this.gm.UIManager.updatePlayerStatusUI();
       },

       getState() { return this._state; }, 
       getPlayer() { return this._state.player; }, 
       getInventory() { return this._state.inventory; }, 
       getCurrentItem() { return this._state.inventory.find(i => (i.uuid || i.id) === this._state.currentItemId); },
       
       setCurrentPage(page) { this._state.currentPage = page; this._state.currentItemId = null; this._state.selectedStatIndex = -1; },
       setCurrentItemId(id) { this._state.currentItemId = id; this._state.selectedStatIndex = -1; },
       setSelectedStatIndex(index) { this._state.selectedStatIndex = index; },
       setFilters(filters) { this._state.filters = { ...this._state.filters, ...filters }; },
       
       updatePlayerResources(cost) { 
           for (const key in cost) { 
               if (key === 'gold') this._state.player.gold = Math.max(0, (this._state.player.gold || 0) - cost[key]);
               else this._state.player.resources[key] = Math.max(0, (this._state.player.resources[key] || 0) - cost[key]); 
           } 
       },
       addPlayerResources(gains) { 
           for (const key in gains) { 
               if (key === 'gold') this._state.player.gold = (this._state.player.gold || 0) + gains[key];
               else this._state.player.resources[key] = (this._state.player.resources[key] || 0) + gains[key]; 
           } 
       },
       addMasteryXp(xp) { 
           this._state.player.mastery.xp += xp; 
           let xpToNextLevel = config.MASTERY_XP_PER_LEVEL(this._state.player.mastery.level); 
           while (this._state.player.mastery.xp >= xpToNextLevel) { 
               this._state.player.mastery.level++; 
               this._state.player.mastery.xp -= xpToNextLevel; 
               xpToNextLevel = config.MASTERY_XP_PER_LEVEL(this._state.player.mastery.level); 
               if (this.gm.showToast) this.gm.showToast(`Soulforge Mastery Level Up! Now Level ${this._state.player.mastery.level}`, false);
           } 
       },
       bulkRemoveItems(itemIds) { 
           this._state.player.inventory = this._state.player.inventory.filter(i => !itemIds.includes(i.uuid || i.id)); 
           this._state.inventory = this._state.player.inventory;
       },
       updateAndSync(action) { 
           action(); 
           this.syncToEngine();
           this._onUpdate(this.getState()); 
       },
       updateItem(updatedItem) { 
           const index = this._state.player.inventory.findIndex(i => (i.uuid || i.id) === (updatedItem.uuid || updatedItem.id)); 
           if (index !== -1) { 
               this._state.player.inventory[index] = updatedItem; 
               this._state.inventory = this._state.player.inventory;
           } 
       },
       removeItem(itemId) { 
           this._state.player.inventory = this._state.player.inventory.filter(i => (i.uuid || i.id) !== itemId); 
           this._state.inventory = this._state.player.inventory;
       }
   };
 
   //================================================================
   // MODULE: Crafting Systems
   //================================================================
   const CraftingSystems = {
       getPrimaryStatKey: (item) => {
           if (!item) return null;
           if (item.stats?.wc !== undefined || item.wc !== undefined) return 'wc';
           if (item.stats?.sc !== undefined || item.sc !== undefined) return 'sc';
           if (item.stats?.ac !== undefined || item.ac !== undefined) return 'ac';
           return null;
       },
       infusion: { 
           // [ARCHITECT FIX] Ensure we only try to infuse Weapons, Armor, and Shields
           isEligible: (item) => (item.forgeType === 'standard' || item.forgeType === 'shadow') && !item.isAscended && CraftingSystems.getPrimaryStatKey(item) !== null, 
           getCost: (item) => {
               const baseGold = item.price || ((item.tier || 1) * 100);
               const baseEssence = (item.tier || 1) * 500;
               const level = item.infusionLevel || 0; 
               const mult = Math.pow(1.5, level); 
               return { gold: Math.floor(baseGold * mult), essence: Math.floor(baseEssence * mult) }; 
           }, 
           preview: (item, isCritical = false) => { 
               const newItem = JSON.parse(JSON.stringify(item));
               const statMultiplier = isCritical ? 1.20 : 1.1;
               const primaryStatKey = CraftingSystems.getPrimaryStatKey(newItem);
               if (primaryStatKey) {
                   newItem.stats[primaryStatKey] = Math.floor(newItem.stats[primaryStatKey] * statMultiplier);
                   // Apply to root for the live engine to read
                   newItem[primaryStatKey] = newItem.stats[primaryStatKey];
               }
               return newItem; 
           }, 
           execute: (item, isCritical) => CraftingSystems.infusion.preview(item, isCritical) 
       },
       rerolling: { 
           isEligible: (item) => item.forgeType === 'shadow' && !item.isAscended, 
           getCost: (item) => {
               return item.rerollCost || { gold: (item.tier || 1) * 1000, essence: (item.tier || 1) * 2000 };
           }, 
           execute: (item, statKey) => { 
               const newItem = JSON.parse(JSON.stringify(item)); 
               const currentStatNames = Object.keys(newItem.stats || {}); 
               
               // Ask the live Engine to perform the reroll logic
               const newEnchant = StateManager.gm.Systems.rerollEnchantment(newItem, currentStatNames);
               if (!newEnchant) return newItem;
               
               // Format the value for UI display
               const displayValue = `+${newEnchant.value}%`;
               
               // Remove old stat from Soulforge UI and Engine Root
               delete newItem.stats[statKey]; 
               delete newItem[statKey];
               
               // [ARCHITECT FIX] Update the actual engine array so it saves properly
               if (Array.isArray(newItem.enchantments)) {
                   // Remove the old enchantment object by matching the effect
                   newItem.enchantments = newItem.enchantments.filter(e => (e.effect || e.name) !== statKey);
                   // Add the new enchantment object
                   newItem.enchantments.push({
                       name: newEnchant.name,
                       effect: newEnchant.effect,
                       value: newEnchant.value,
                       tier: newEnchant.tier
                   });
               }
               
               // Apply new stat to Soulforge UI and Engine Root
               newItem.stats[newEnchant.key] = displayValue; 
               newItem[newEnchant.key] = displayValue;
               
               return newItem; 
           } 
       },
       shatter: { 
           isEligible: (item) => (item.forgeType === 'shadow' || item.forgeType === 'echo') && !item.isAscended, 
           getGain: (item, isCritical) => ({ essence: (item.essenceValue || 100) * (isCritical ? 2 : 1) }), 
       },
       ascension: { 
           isEligible: (item, minLevel) => item.forgeType === 'shadow' && !item.isAscended && item.infusionLevel >= minLevel, 
           getCost: (item, isCritical) => { 
               const cost = item.ascensionCost || { gold: (item.tier || 1) * 25000, essence: (item.tier || 1) * 50000, primalSouls: 1 }; 
               if (isCritical) { cost.primalSouls = 0; } 
               return cost; 
           }, 
           execute: (item) => { 
               const newItem = JSON.parse(JSON.stringify(item));
               newItem.isAscended = true;
               const primaryStatKey = CraftingSystems.getPrimaryStatKey(newItem);
               if (primaryStatKey) {
                   newItem.stats[primaryStatKey] = Math.floor(newItem.stats[primaryStatKey] * 1.5);
                   newItem[primaryStatKey] = newItem.stats[primaryStatKey];
               }
               return newItem; 
           } 
       },
       canAfford: (player, cost) => { 
           if (!cost) return false; 
           return Object.keys(cost).every(key => {
               const val = key === 'gold' ? (player.gold || 0) : (player.resources?.[key] || 0);
               return val >= cost[key];
           }); 
       }
   };
 
   //================================================================
   // MODULE: UI Manager
   //================================================================
   const UIManager = {
       _elements: {}, _controller: null, _onConfirmCallback: () => {},

               }
           });

           if (enchantHTML) {
               enchantHTML = `<div class="mt-2 pt-2 border-t border-gray-700"><div class="text-[10px] text-cyan-500 uppercase tracking-widest mb-1 font-orbitron">Enchantments</div>${enchantHTML}</div>`;

                       for (const [k, v] of Object.entries(gem)) {
                           if (k.includes('_bonus') || k.includes('_steal') || k.includes('_pct') || k.includes('_debuff')) {

   const SoulforgeController = {

       refreshUI() { UIManager.render(StateManager.getState(), this.getVisibleInventory()); },
       getVisibleInventory() { 
           const state = StateManager.getState();
           let pool = state.inventory;
           if (state.currentPage === 'infusion') pool = state.inventory.filter(i => CraftingSystems.infusion.isEligible(i)); 
           else if (state.currentPage === 'shatter') pool = state.inventory.filter(i => CraftingSystems.shatter.isEligible(i));

           else if (state.currentPage === 'ascension') pool = state.inventory.filter(i => CraftingSystems.ascension.isEligible(i, config.ASCENSION_MIN_LEVEL)); 
           
           const { search, sort, category } = state.filters;
           const filtered = pool.filter(i => {
               const itemName = (i.name || 'Unknown Item').toLowerCase();
               const itemType = (i.type || i.category || '').toLowerCase();

                   if (category === 'weapon' && !['weapon', 'axe', 'sword', 'mace', 'dagger', 'bow', 'staff', 'claw', 'shield', 'arrow', 'offhand'].some(t => itemType.includes(t) || itemName.includes(t))) return false;
                   if (category === 'armor' && !['armor', 'helmet', 'chest', 'leggings', 'boots', 'gloves'].some(t => itemType.includes(t) || itemName.includes(t))) return false;
                   if (category === 'jewelry' && !['jewelry', 'ring', 'necklace', 'amulet'].some(t => itemType.includes(t) || itemName.includes(t))) return false;
                   if (category === 'spell' && !['spell', 'scroll', 'buff', 'air', 'earth', 'fire', 'water', 'cold', 'arcane', 'death', 'drain'].some(t => itemType.includes(t) || itemName.includes(t))) return false;
               }
               
               return true;

               const key = CraftingSystems.getPrimaryStatKey(item);

               const nameA = a.name || 'Unknown Item';
               const nameB = b.name || 'Unknown Item';
               if (sort === 'primaryStat') return getPrimaryStatValue(b) - getPrimaryStatValue(a);
               return nameA.localeCompare(nameB);
           }); 
       },
       getState() { return StateManager.getState(); },
       onNavigate(page) { 
           StateManager.setCurrentPage(page); 
           const visibleInventory = this.getVisibleInventory(); 
           if (visibleInventory.length > 0) { 
               // [ARCHITECT FIX] Safely target live Engine UUIDs
               StateManager.setCurrentItemId(visibleInventory[0].uuid || visibleInventory[0].id); 
           } 
           this.refreshUI(); 
       },
       onSelectItem(itemId) { StateManager.setCurrentItemId(itemId); this.refreshUI(); },
       onSelectStat(statKey) { StateManager.setSelectedStatIndex(statKey); this.refreshUI(); },
       onFilterChange(filter) { StateManager.setFilters(filter); this.refreshUI(); },
       onAction() { const state = StateManager.getState(); const item = StateManager.getCurrentItem(); if (!item) return; switch(state.currentPage) { case 'infusion': this.executeInfusion(item); break; case 'rerolling': this.executeReroll(item, state.selectedStatIndex); break; case 'shatter': UIManager.showModal({ title: 'Shatter Item', message: `Shatter <strong>${item.name}</strong>? This cannot be undone.`, onConfirm: () => this.executeShatter(item), confirmClass: 'shatter-mode' }); break; case 'ascension': UIManager.showModal({ title: 'Ascend Item', message: `Ascend <strong>${item.name}</strong>? The item will become permanent.`, onConfirm: () => this.executeAscension(item), confirmClass: 'ascension-mode' }); break; } },
       onBulkShatter() { UIManager.showBulkShatterModal(StateManager.getState()); },
       onBulkShatterEchoes() { const echoes = StateManager.getInventory().filter(i => i.forgeType === 'echo'); if (echoes.length === 0) return; const totalGain = echoes.reduce((sum, item) => sum + (item.essenceValue || 100), 0); UIManager.hideBulkShatterModal(); UIManager.showModal({ title: 'Bulk Shatter Echoes', message: `Shatter <strong>${echoes.length}</strong> Echo items for <strong>${totalGain.toLocaleString()}</strong> Essence?`, onConfirm: () => this.executeBulkShatterEchoes(echoes), confirmClass: 'shatter-mode'}); },
       onBulkShatterShadows(tiers) { if (tiers.length === 0) return; const itemsToShatter = StateManager.getInventory().filter(i => i.forgeType === 'shadow' && !i.isAscended && tiers.includes(i.tier)); const totalGain = itemsToShatter.reduce((sum, item) => sum + (item.essenceValue || 500), 0); UIManager.hideBulkShatterModal(); UIManager.showModal({ title: 'Bulk Shatter Shadows', message: `Shatter <strong>${itemsToShatter.length}</strong> items from tiers <strong>[${tiers.join(', ')}]</strong> for <strong>${totalGain.toLocaleString()}</strong> Essence?`, onConfirm: () => this.executeBulkShatterShadows(itemsToShatter), confirmClass: 'shatter-mode'}); },
       _performCraft(logic) { const isCritical = Math.random() < config.CRITICAL_SUCCESS_CHANCE; let xpGained = config.MASTERY_XP_GAIN; if (isCritical) { xpGained += config.MASTERY_CRITICAL_XP_BONUS; UIManager.showCriticalSuccess(); } StateManager.updateAndSync(() => { logic(isCritical); StateManager.addMasteryXp(xpGained); }); this.refreshUI(); },
       executeInfusion(item) { this._performCraft((isCritical) => { const cost = CraftingSystems.infusion.getCost(item); if (!CraftingSystems.canAfford(StateManager.getPlayer(), cost)) return; const newItem = CraftingSystems.infusion.execute(item, isCritical); StateManager.updatePlayerResources(cost); StateManager.updateItem({ ...newItem, infusionLevel: item.infusionLevel + 1 }); UIManager.triggerItemAnimation('var(--accent-cyan)'); }); },
       executeReroll(item, statKey) { if (statKey === -1) return; this._performCraft((isCritical) => { const cost = CraftingSystems.rerolling.getCost(item); if (!CraftingSystems.canAfford(StateManager.getPlayer(), cost)) return; const newItem = CraftingSystems.rerolling.execute(item, statKey); if (!isCritical) { StateManager.updatePlayerResources(cost); } else { UIManager.showModal({title: 'Critical Success!', message: 'Your reroll was free!', onConfirm: () => {}})} StateManager.updateItem(newItem); StateManager.setSelectedStatIndex(-1); UIManager.triggerItemAnimation('var(--accent-orange)'); }); },
       executeShatter(item) { this._performCraft((isCritical) => { UIManager.triggerItemAnimation('var(--accent-red)'); const gain = CraftingSystems.shatter.getGain(item, isCritical); StateManager.addPlayerResources(gain); StateManager.removeItem(item.uuid || item.id); StateManager.setCurrentItemId(null); }); this.onNavigate('shatter'); },
       executeBulkShatterEchoes(echoes) { this._performCraft((isCritical) => { UIManager.triggerItemAnimation('var(--accent-red)'); const totalGain = echoes.reduce((sum, item) => sum + (item.essenceValue || 100), 0); const echoIds = echoes.map(i => i.uuid || i.id); StateManager.addPlayerResources({ essence: totalGain * (isCritical ? 2 : 1) }); StateManager.bulkRemoveItems(echoIds); StateManager.setCurrentItemId(null); }); this.onNavigate('shatter'); },
       executeBulkShatterShadows(items) { this._performCraft((isCritical) => { UIManager.triggerItemAnimation('var(--accent-red)'); const totalGain = items.reduce((sum, item) => sum + (item.essenceValue || 500), 0); const itemIds = items.map(i => i.uuid || i.id); StateManager.addPlayerResources({ essence: totalGain * (isCritical ? 2 : 1) }); StateManager.bulkRemoveItems(itemIds); StateManager.setCurrentItemId(null); }); this.onNavigate('shatter'); },
       executeAscension(item) { this._performCraft((isCritical) => { const cost = CraftingSystems.ascension.getCost(item, isCritical); if (!CraftingSystems.canAfford(StateManager.getPlayer(), cost)) return; const newItem = CraftingSystems.ascension.execute(item); StateManager.updatePlayerResources(cost); StateManager.updateItem(newItem); UIManager.triggerItemAnimation('var(--accent-ascended)'); }); }
   };
 
   // --- INITIALIZATION ---
   window.SoulforgeController = SoulforgeController;

   // --- ROBUST AUTO-START ---
   (function connectToEngine() {
       const findEngine = () => window.parent.gameManager || window.gameManager || (window.opener ? window.opener.gameManager : null);
       
       const attemptConnection = () => {
           const gm = findEngine();
           if (gm && gm.state && gm.state.player) {
               console.log("🔨 Soulforge Connected to Engine.");
               SoulforgeController.init(gm);
           } else {
               console.log("🔨 Soulforge waiting for Engine...");
               setTimeout(attemptConnection, 200);
           }
       };
       attemptConnection();
   })();
</script>
