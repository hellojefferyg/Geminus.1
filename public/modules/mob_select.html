<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: transparent; font-family: 'Inter', sans-serif; color: #e0f8ff; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(0, 255, 255, 0.2); }
        .monster-card:hover { transform: translateY(-2px); border-color: #fca5a5; box-shadow: 0 0 15px rgba(252, 165, 165, 0.2); }
    </style>
</head>
<body class="h-screen w-full flex flex-col p-6 overflow-hidden">
    <div class="text-center mb-8">
        <h1 class="font-cinzel text-3xl text-red-400 tracking-widest uppercase text-shadow">Select Your Opponent</h1>
        <p class="text-slate-400 text-sm mt-2">Choose wisely, Ascendant. Death is only a setback.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto w-full">
        <div class="glass-panel p-6 rounded-xl border border-slate-700 cursor-pointer transition-all duration-300 monster-card group">
            <div class="h-32 w-full bg-slate-900 rounded-lg mb-4 flex items-center justify-center border border-slate-800 group-hover:border-red-500/50">
                <span class="text-4xl">🐀</span>
            </div>
            <h3 class="font-cinzel text-xl text-white group-hover:text-red-300">Dire Rat</h3>
            <p class="text-xs text-slate-400 mb-4">Level 1 • Vermin</p>
            <div class="flex justify-between text-sm text-slate-300 border-t border-slate-700 pt-3">
                <span>HP: 80</span>
                <span class="text-yellow-500">Gold: 5</span>
            </div>
            <button class="w-full mt-4 bg-red-900/40 border border-red-500/50 text-red-200 py-2 rounded hover:bg-red-600 hover:text-white transition-colors font-cinzel">Fight</button>
        </div>

        <div class="glass-panel p-6 rounded-xl border border-slate-700 cursor-pointer transition-all duration-300 monster-card group">
            <div class="h-32 w-full bg-slate-900 rounded-lg mb-4 flex items-center justify-center border border-slate-800 group-hover:border-red-500/50">
                <span class="text-4xl">🐺</span>
            </div>
            <h3 class="font-cinzel text-xl text-white group-hover:text-red-300">Shadow Wolf</h3>
            <p class="text-xs text-slate-400 mb-4">Level 3 • Beast</p>
            <div class="flex justify-between text-sm text-slate-300 border-t border-slate-700 pt-3">
                <span>HP: 150</span>
                <span class="text-yellow-500">Gold: 12</span>
            </div>
            <button class="w-full mt-4 bg-red-900/40 border border-red-500/50 text-red-200 py-2 rounded hover:bg-red-600 hover:text-white transition-colors font-cinzel">Fight</button>
        </div>

        <div class="glass-panel p-6 rounded-xl border border-slate-700 cursor-pointer transition-all duration-300 monster-card group">
            <div class="h-32 w-full bg-slate-900 rounded-lg mb-4 flex items-center justify-center border border-slate-800 group-hover:border-red-500/50">
                <span class="text-4xl">💀</span>
            </div>
            <h3 class="font-cinzel text-xl text-white group-hover:text-red-300">Crypt Walker</h3>
            <p class="text-xs text-slate-400 mb-4">Level 5 • Undead</p>
            <div class="flex justify-between text-sm text-slate-300 border-t border-slate-700 pt-3">
                <span>HP: 300</span>
                <span class="text-yellow-500">Gold: 25</span>
            </div>
            <button class="w-full mt-4 bg-red-900/40 border border-red-500/50 text-red-200 py-2 rounded hover:bg-red-600 hover:text-white transition-colors font-cinzel">Fight</button>
        </div>
    </div>
</body>
</html>
